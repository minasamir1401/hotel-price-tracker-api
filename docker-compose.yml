services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: hotel-scraper-backend:latest
    container_name: hotel-scraper-backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - NODE_ENV=production
      - ALMOSAFER_API_TOKEN=${ALMOSAFER_API_TOKEN:-}
      - ALMOSAFER_ORIGIN=${ALMOSAFER_ORIGIN:-https://www.almosafer.com}
      - ALMOSAFER_HTTP_TRANSPORT=${ALMOSAFER_HTTP_TRANSPORT:-scrapingant}
      - SCRAPINGANT_API_KEYS=${SCRAPINGANT_API_KEYS:-}
      - ALMOSAFER_BROWSER_WS_ENDPOINT=${ALMOSAFER_BROWSER_WS_ENDPOINT:-}
      - ALMOSAFER_BROWSER_ORIGIN=${ALMOSAFER_BROWSER_ORIGIN:-}
      - ALMOSAFER_DIRECT_AFTER_BOOTSTRAP=${ALMOSAFER_DIRECT_AFTER_BOOTSTRAP:-1}
      - ALMOSAFER_HANDOFF_HTTP_TRANSPORT=${ALMOSAFER_HANDOFF_HTTP_TRANSPORT:-curl}
      - ALMOSAFER_BROWSER_FALLBACK=${ALMOSAFER_BROWSER_FALLBACK:-1}
      - ALMOSAFER_BROWSER_HEADLESS=${ALMOSAFER_BROWSER_HEADLESS:-0}
      - ALMOSAFER_PROXY_URL=${ALMOSAFER_PROXY_URL:-}
      - BOOKING_APP_AUTHORIZATION=${BOOKING_APP_AUTHORIZATION:-}
      - BOOKING_APP_SIGNATURE_SALT=${BOOKING_APP_SIGNATURE_SALT:-}
      - BOOKING_APP_VERSION=${BOOKING_APP_VERSION:-67.4.0.11}
      - BOOKING_APP_DEVICE_ID=${BOOKING_APP_DEVICE_ID:-}
      - BOOKING_AUTH_TOKEN=${BOOKING_AUTH_TOKEN:-}
      - BOOKING_AUTH_EXPIRES_AT=${BOOKING_AUTH_EXPIRES_AT:-}
      - BOOKING_ACCOUNT_ACCESS_KEY=${BOOKING_ACCOUNT_ACCESS_KEY:-}
      - BOOKING_SITE_ORIGIN=${BOOKING_SITE_ORIGIN:-}
      - BOOKING_RATE_MODE=${BOOKING_RATE_MODE:-auto}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api
    image: hotel-scraper-frontend:latest
    container_name: hotel-scraper-frontend
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:5000
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
